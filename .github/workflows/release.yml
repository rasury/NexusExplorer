name: Publish release
on:
  workflow_dispatch:
    inputs:
      resume_draft:
        description: Resume a draft for this exact commit
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nexus-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify 7-Zip dependency
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7-Zip is required to restore mpv. Install it on the runner before publishing.'
          }
          & $sevenZip i
          if ($LASTEXITCODE -ne 0) { throw '7-Zip cannot run.' }
          "MPV_7ZIP=$sevenZip" >> $env:GITHUB_ENV
      - name: Verify release selection
        shell: powershell
        run: ./tests/Release-Selection.Tests.ps1
      - name: Build and publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_DRAFT: ${{ inputs.resume_draft }}
        run: ./scripts/Publish-Release.ps1 -ResumeDraft:($env:RESUME_DRAFT -eq 'true')
